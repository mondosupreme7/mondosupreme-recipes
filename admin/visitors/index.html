<body>
<header class="site-header"><div class="wrap hdr">
 <a href="/admin/visitors/" class="brand"><span>Visitors</span></a>
 <nav class="site-nav" aria-label="Site"><a href="/">Home</a><a href="/admin/visitors/" aria-current="page">Visitors</a></nav>
</div></header>
<main class="wrap">
 <header class="coast-hero">
  <h1>Visitors</h1>
  <p class="coast-lead">Anonymous page views. No IP addresses, emails, or precise coordinates.</p>
 </header>
 <p id="visitGate" class="visit-gate" role="status">Checking access…</p>
 <div id="visitApp" hidden>
  <div class="visit-chips">
   <div class="visit-chip" id="chipToday"></div>
   <div class="visit-chip" id="chipWeek"></div>
   <div class="visit-chip" id="chipMonth"></div>
  </div>
  <div class="visit-filter">
   <label>From<input id="visitFrom" type="date"></label>
   <label>To<input id="visitTo" type="date"></label>
   <button class="btn" id="visitApply" type="button">Apply</button>
  </div>
  <div class="visit-split">
   <section class="coast-card visit-card"><h2>Top pages</h2><ul id="topPages" class="visit-rank"></ul></section>
   <section class="coast-card visit-card"><h2>Top referrers</h2><ul id="topRefs" class="visit-rank"></ul></section>
   <section class="coast-card visit-card"><h2>Top locations</h2><ul id="topPlaces" class="visit-rank"></ul></section>
   <section class="coast-card visit-card"><h2>Devices and browsers</h2><ul id="topDevices" class="visit-rank"></ul></section>
  </div>
  <section class="coast-card visit-card">
   <h2>Recent visits</h2>
   <div id="visitRows"></div>
   <div class="visit-tools">
    <button class="btn" id="visitMore" type="button" hidden>Show more</button>
    <button class="btn" id="visitClear" type="button">Clear logs older than 90 days</button>
   </div>
   <p id="visitStatus" class="visit-note" role="status"></p>
  </section>
 </div>
</main>
<footer class="site-footer"><div class="wrap">© <span id="yr"></span> Mondosupreme · <a href="/privacy/">Privacy</a></div></footer>
