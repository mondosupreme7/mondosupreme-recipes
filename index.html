<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mondosupreme Recipes</title>
<meta name="description" content="Mondosupreme Recipes — your personal recipe collection at Mondosupreme.com">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css"></head>
<body>
<header class="site-header"><div class="wrap hdr">
 <a href="#/" class="brand"><span class="logo">🍲</span><span>Mondosupreme <em>Recipes</em></span></a>
 <nav class="actions">
  <button id="btnAdd" class="btn primary">+ Add Recipe</button>
  <button id="btnExport" class="btn ghost">Export</button>
  <label class="btn ghost">Import<input type="file" id="importFile" accept="application/json,.json" hidden></label>
 </nav></div></header>
<main class="wrap" id="app">
 <section id="listView">
  <div class="hero"><h1>Cook something supreme.</h1><p>Your personal kitchen notebook — saved right in your browser.</p></div>
  <div class="toolbar">
   <input id="search" type="search" placeholder="Search recipes, ingredients, tags…" aria-label="Search">
   <select id="catFilter" aria-label="Category"><option value="">All categories</option></select>
   <select id="tagFilter" aria-label="Tag"><option value="">All tags</option></select>
   <button id="favFilter" class="btn ghost" aria-pressed="false">♡ Favorites</button>
  </div>
  <div id="grid" class="grid"></div>
  <p id="empty" class="empty" hidden>No recipes found. Try a different search or add a new recipe!</p>
 </section>
 <section id="detailView" hidden></section>
</main>
<dialog id="editor"><form id="recipeForm" method="dialog">
 <h2 id="formTitle">Add Recipe</h2>
 <input type="hidden" name="id">
 <label>Title*<input name="title" required></label>
 <label>Photo URL<input name="photo" type="url" placeholder="https://…"></label>
 <div class="row">
  <label>Category<input name="category" list="catList" placeholder="e.g. Dinner"></label>
  <label>Servings<input name="servings" type="number" min="1"></label>
 </div>
 <datalist id="catList"></datalist>
 <div class="row">
  <label>Prep time (min)<input name="prep" type="number" min="0"></label>
  <label>Cook time (min)<input name="cook" type="number" min="0"></label>
 </div>
 <label>Ingredients (one per line)<textarea name="ingredients" rows="5"></textarea></label>
 <label>Steps (one per line)<textarea name="steps" rows="6"></textarea></label>
 <label>Notes<textarea name="notes" rows="2"></textarea></label>
 <label>Tags (comma separated)<input name="tags" placeholder="quick, vegetarian"></label>
 <div class="form-actions"><button type="button" id="cancelEdit" class="btn ghost">Cancel</button><button type="submit" class="btn primary">Save Recipe</button></div>
</form></dialog>
<footer class="site-footer no-print"><div class="wrap">© <span id="yr"></span> Mondosupreme.com · Recipes are stored locally in your browser — use Export to back up.</div></footer>
<div id="toast" role="status"></div>
<script src="app.js"></script>
</body></html>
