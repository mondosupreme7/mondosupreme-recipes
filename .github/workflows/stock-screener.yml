name: Update oversold stock screener

# Prices the S&P 500, Nasdaq-100, and S&P MidCap 400 from Yahoo Finance and
# writes stocks/oversold.json. Weekday crons are UTC so they cover 9:30am–4pm
# Eastern in both EST and EDT: the 13:30 UTC run is the EDT open (and 8:30am
# EST), and the 21:00 UTC run is the EST close (and 5:00pm EDT). Sunday
# refreshes the Wikipedia constituent list. A push made with GITHUB_TOKEN does
# not start the Pages workflow, so this job deploys the site itself when the
# snapshot changes. A failed fetch keeps the previous file.

on:
  push:
    branches: [main]
    paths:
      - scripts/update-oversold-stocks.py
      - .github/workflows/stock-screener.yml
  schedule:
    - cron: '30 13 * * 1-5'
    - cron: '0,30 14-20 * * 1-5'
    - cron: '0 21 * * 1-5'
    - cron: '15 12 * * 0'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: stock-screener
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Fetch oversold snapshot
        env:
          STOCKS_FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
          STOCKS_REFRESH_UNIVERSE: ${{ (github.event_name == 'workflow_dispatch' || github.event.schedule == '15 12 * * 0') && '1' || '0' }}
          STOCKS_UNIVERSE_ONLY: ${{ github.event.schedule == '15 12 * * 0' && '1' || '0' }}
        run: python3 scripts/update-oversold-stocks.py

      - name: Commit snapshot
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stocks/oversold.json scripts/universe.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Screener unchanged."
            exit 0
          fi
          git commit -m "Update oversold stock screener"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Configure Pages
        if: steps.commit.outputs.changed == 'true'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with:
          enablement: true

      - name: Upload Pages artifact
        if: steps.commit.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: .
          include-hidden-files: true

      - name: Deploy to GitHub Pages
        id: deployment
        if: steps.commit.outputs.changed == 'true'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
