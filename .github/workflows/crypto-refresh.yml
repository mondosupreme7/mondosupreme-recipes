name: Refresh crypto watchlist

# Daily mark of the paper crypto watchlist in stocks/crypto.json.
# The book is informational only. This does not place an order.
# Crypto trades every day, and the file's rule is a mark at the 00:00 UTC
# close. 00:15 UTC is 7:15 p.m. EST and 8:15 p.m. EDT. One cron is enough:
# the close is midnight UTC, not the New York cash close, so there is no
# second summer clock. The script keeps the previous file when a quote fails.
# Push does not refresh. The first live mark is the scheduled run, or a
# workflow_dispatch, after this workflow is on the default branch.

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - scripts/update_crypto.py
      - scripts/test_crypto_refresh.py
      - .github/workflows/crypto-refresh.yml
      - stocks/crypto.json
  schedule:
    - cron: '15 0 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Test crypto refresh
        run: python3 -m unittest scripts/test_crypto_refresh.py

  refresh:
    needs: test
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: crypto-refresh
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Refresh the paper watchlist
        run: python3 scripts/update_crypto.py

      - name: Commit watchlist
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stocks/crypto.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Crypto watchlist unchanged."
            exit 0
          fi
          git commit -m "Refresh crypto watchlist"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Configure Pages
        if: steps.commit.outputs.changed == 'true'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with:
          enablement: true

      - name: Upload Pages artifact
        if: steps.commit.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: .
          include-hidden-files: true

      - name: Deploy to GitHub Pages
        id: deployment
        if: steps.commit.outputs.changed == 'true'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
