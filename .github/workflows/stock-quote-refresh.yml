name: Refresh stock quotes

# Light price refresh for the published swing list during the US cash session.
# Crons are UTC so they cover 9:30am–4:00pm Eastern in both EST and EDT:
# 13:30 UTC is the EDT open, and 21:00 UTC is the EST close. The script skips a
# scheduled run that falls outside 9:30–16:00 America/New_York. A push or a
# manual run refreshes anyway. Quotes that fail stay on the previous price.

on:
  push:
    branches: [main]
    paths:
      - scripts/update-oversold-stocks.py
      - scripts/swing-params.json
      - .github/workflows/stock-quote-refresh.yml
  schedule:
    - cron: '30 13 * * 1-5'
    - cron: '0,30 14-20 * * 1-5'
    - cron: '0 21 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: stock-quotes
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Refresh quotes
        env:
          STOCKS_QUOTES: "1"
          STOCKS_FORCE: ${{ github.event_name != 'schedule' && '1' || '0' }}
        run: python3 scripts/update-oversold-stocks.py

      - name: Commit snapshot
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stocks/oversold.json stocks/picks-history.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Quotes unchanged."
            exit 0
          fi
          git commit -m "Refresh stock quotes"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Configure Pages
        if: steps.commit.outputs.changed == 'true'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with:
          enablement: true

      - name: Upload Pages artifact
        if: steps.commit.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: .
          include-hidden-files: true

      - name: Deploy to GitHub Pages
        id: deployment
        if: steps.commit.outputs.changed == 'true'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
