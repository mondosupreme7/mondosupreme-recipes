name: Update daily YouTube recipe pool

# Reads public cooking-channel RSS feeds into daily-recipe/daily.json.
# YouTube's feed endpoint often answers 404 for a few hours; the script
# falls back to the public channel page and keeps the last good file.
# A push made with GITHUB_TOKEN does not start the Pages workflow, so
# this job deploys the site itself when the pool changes.

on:
  schedule:
    - cron: '15 12 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-recipe
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Fetch daily recipe pool
        env:
          DAILY_FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: python3 scripts/update-daily-recipe.py

      - name: Commit snapshot
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add daily-recipe/daily.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Daily pool unchanged."
            exit 0
          fi
          git commit -m "Update MondoTV daily recipe pool"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Configure Pages
        if: steps.commit.outputs.changed == 'true'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with:
          enablement: true

      - name: Upload Pages artifact
        if: steps.commit.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: .
          include-hidden-files: true

      - name: Deploy to GitHub Pages
        id: deployment
        if: steps.commit.outputs.changed == 'true'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
