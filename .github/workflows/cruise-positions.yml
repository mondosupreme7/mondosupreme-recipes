name: Update cruise positions

# Listens to aisstream.io for about 75 seconds, fills quiet ships from Open
# Waters, and publishes cruises/positions.json. Once a day it also refreshes
# cruises/canaveral-deals.json from Royal Caribbean's public Port Canaveral
# search. The cron is every 5 minutes,
# the shortest interval GitHub Actions allows. The page itself asks Open
# Waters about every 30 seconds and re-reads this snapshot every 60 seconds
# while the tab is visible. Set the AISSTREAM_API_KEY
# repository secret from an aisstream.io account key. The job never prints
# the key. A push made with GITHUB_TOKEN does not start the Pages workflow,
# so this job deploys the site itself when the snapshot changes.

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: cruise-positions
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Fetch positions
        env:
          AISSTREAM_API_KEY: ${{ secrets.AISSTREAM_API_KEY }}
          AISSTREAM_WINDOW_SECONDS: "75"
        run: |
          python3 -m pip install --disable-pip-version-check websockets==15.0.1
          python3 scripts/update-cruise-positions.py

      - name: Fetch Port Canaveral deals
        if: success() || failure()
        env:
          CANAVERAL_DEALS_FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: python3 scripts/update-canaveral-deals.py

      - name: Commit positions
        id: commit
        if: success() || failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cruises/positions.json cruises/canaveral-deals.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Positions unchanged."
            exit 0
          fi
          if git diff --cached --name-only | grep -q 'canaveral-deals.json'; then
            if git diff --cached --name-only | grep -q 'positions.json'; then
              msg="Update Royal Caribbean ship positions and Port Canaveral deals"
            else
              msg="Update Port Canaveral Royal Caribbean cruise deals"
            fi
          else
            msg="Update Royal Caribbean ship positions"
          fi
          git commit -m "$msg"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Configure Pages
        if: steps.commit.outputs.changed == 'true'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with:
          enablement: true

      - name: Upload Pages artifact
        if: steps.commit.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: .
          include-hidden-files: true

      - name: Deploy to GitHub Pages
        id: deployment
        if: steps.commit.outputs.changed == 'true'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
