<title>Grocery List — Mondosupreme</title>
<meta name="description" content="A mobile grocery list by aisle, with imports from your recipes and meal plan.">

<body>
<header class="site-header"><div class="wrap hdr">
 <a href="/grocery/" class="brand">Grocery</a>
 <nav class="site-nav" aria-label="Site"><a href="/">Home</a><a href="/grocery/" aria-current="page">Grocery</a></nav>
</div></header>
<main class="wrap">
 <header class="coast-hero">
  <h1>Grocery list</h1>
  <p class="coast-lead">Check items off by aisle. The list stays on this device and syncs to your account when you are signed in.</p>
 </header>
 <form id="gForm" class="row-actions">
  <label>Add an item <input id="gText" maxlength="120" required placeholder="Bananas"></label>
  <label>Aisle <select id="gAisle"></select></label>
  <button class="btn primary" type="submit">Add</button>
 </form>
 <div class="row-actions">
  <button class="btn" id="gRecipes" type="button">Import recipes</button>
  <button class="btn" id="gPlan" type="button">Import meal plan</button>
  <button class="btn" id="gClear" type="button">Clear completed</button>
  <button class="btn" id="gCopy" type="button">Copy list</button>
 </div>
 <p id="gStatus" class="coast-note" role="status">The list is empty.</p>
 <div id="aisles"></div>
</main>
<footer class="site-footer"><div class="wrap">© <span id="yr"></span> Mondosupreme</div></footer>
