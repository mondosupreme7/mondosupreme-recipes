<title>Connections &amp; Sudoku — Mondosupreme</title>
<meta name="description" content="A daily four-group word puzzle and a daily mini sudoku, with notes, a timer, and a spoiler-free share.">
<link rel="stylesheet" href="/recipes/styles.css">
<link rel="stylesheet" href="/retro.css">
<link rel="stylesheet" href="/shell.css">
<link rel="stylesheet" href="/coast.css">
<link rel="stylesheet" href="/readable.css">

<body>
<header class="site-header"><div class="wrap hdr">
 <a href="/connections/" class="brand">Puzzles</a>
 <nav class="site-nav" aria-label="Site"><a href="/">Home</a><a href="/connections/" aria-current="page">Puzzles</a></nav>
</div></header>
<main class="wrap">
 <header class="coast-hero">
  <h1>Connections</h1>
  <p class="coast-lead">Find four groups of four. The same board is up for every visitor today. <span id="connDate"></span></p>
  <p id="connLives"></p>
  <p id="connStreak"></p>
 </header>
 <div id="connGroups"></div>
 <div id="connGrid" class="conn-grid"></div>
 <div class="row-actions">
  <button class="btn primary" id="connSubmit" type="button">Submit four</button>
  <button class="btn" id="connShuffle" type="button">Shuffle</button>
  <button class="btn" id="connShare" type="button">Share grid</button>
 </div>
 <p id="connMsg" class="coast-note" role="status"></p>
 <header class="coast-hero">
  <h1>Daily sudoku</h1>
  <p class="coast-lead">A 6×6 mini or a 9×9 board from today’s date. Notes, a timer, and a share line that leaves the digits out.</p>
  <p id="sudoTime">0:00</p>
  <p id="sudoStreak"></p>
 </header>
 <div class="row-actions">
  <button class="btn" id="size6" type="button">6×6</button>
  <button class="btn" id="size9" type="button">9×9</button>
  <button class="btn" id="noteMode" type="button" aria-pressed="false">Notes</button>
  <button class="btn" id="sudoClear" type="button">Erase</button>
  <button class="btn" id="sudoShare" type="button">Share</button>
 </div>
 <div class="sudo-wrap"><div id="sudo" class="sudo"></div></div>
 <div id="digits" class="row-actions"></div>
 <p id="sudoMsg" class="coast-note" role="status"></p>
 <pre id="shareOut" class="coast-note"></pre>
</main>
<footer class="site-footer"><div class="wrap">© <span id="yr"></span> Mondosupreme</div></footer>
<script src="/retro-theme.js"></script>
<script src="/era.js"></script>

<script src="/board/vendor/firebase/firebase-auth-compat.js"></script>
<script src="/board/vendor/firebase/firebase-database-compat.js"></script>
<script src="/board/config.js"></script>
<script src="/members.js"></script>
<script src="/shell.js"></script>
<script src="/backup.js"></script>
<script src="connections.js"></script>
</body>
</html>
