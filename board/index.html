<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://www.google.com https://www.gstatic.com https://apis.google.com; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://www.google.com https://www.gstatic.com; connect-src 'self' https://*.firebaseio.com wss://*.firebaseio.com https://*.firebasedatabase.app wss://*.firebasedatabase.app https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://securetoken.google.com https://www.googleapis.com https://recaptchaenterprise.googleapis.com https://*.firebaseapp.com https://www.google.com https://www.gstatic.com; frame-src https://*.firebaseapp.com https://*.web.app https://www.google.com https://recaptcha.google.com; object-src 'none'; base-uri 'self'">
<title>Mondosupreme Board</title>
<meta name="description" content="A shared drawing board on Mondosupreme.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/recipes/styles.css">
<link rel="stylesheet" href="board.css">
</head>
<body class="board-page">
<header class="site-header"><div class="wrap hdr">
 <a href="/board/" class="brand"><span class="logo">🎨</span><span>Mondosupreme <em>Board</em></span></a>
 <nav class="site-nav" aria-label="Site">
  <a href="/">Home</a>
  <a href="/recipes/">Recipes</a>
  <a href="/cruises/">Cruises</a>
  <a href="/wiki/">Wiki</a>
  <a href="/board/" aria-current="page">Board</a>
  <a href="/chat/">Chat</a>
 </nav>
</div></header>
<main>
 <div class="board-tools" role="toolbar" aria-label="Drawing tools">
  <div id="colors" class="board-group"></div>
  <div id="sizes" class="board-group"></div>
  <button type="button" id="eraser" class="tool" aria-pressed="false">Eraser</button>
  <button type="button" id="undo" class="tool">Undo</button>
  <button type="button" id="pan" class="tool" aria-pressed="false">Pan</button>
  <button type="button" id="zoomOut" class="tool" aria-label="Zoom out">−</button>
  <button type="button" id="zoomIn" class="tool" aria-label="Zoom in">+</button>
  <button type="button" id="zoomFit" class="tool">Fit</button>
  <button type="button" id="clear" class="tool" hidden>Clear board</button>
  <button type="button" id="owner" class="tool" hidden>Owner</button>
  <span id="status" class="board-status" role="status">Loading…</span>
 </div>
 <div id="stage" class="board-stage"><canvas id="pad" aria-label="Drawing board"></canvas></div>
</main>
<dialog id="ownerDialog">
 <form id="ownerForm">
  <h2>Owner sign-in</h2>
  <p>Sign in to clear the board for everyone. The password is checked by Firebase and is not stored on this site.</p>
  <label>Email<input id="ownerEmail" type="email" autocomplete="username" required></label>
  <label>Password<input id="ownerPass" type="password" autocomplete="current-password" required></label>
  <p id="ownerError" class="board-error" hidden></p>
  <div class="form-actions">
   <button type="button" id="ownerCancel" class="btn ghost">Cancel</button>
   <button type="submit" class="btn primary">Sign in</button>
  </div>
 </form>
</dialog>
<script src="vendor/firebase/firebase-app-compat.js"></script>
<script src="vendor/firebase/firebase-auth-compat.js"></script>
<script src="vendor/firebase/firebase-database-compat.js"></script>
<script src="config.js"></script>
<script src="board.js"></script>
</body>
</html>
