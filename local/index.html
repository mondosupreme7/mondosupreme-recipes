 <header class="coast-hero">

 </header>

  <label>Place <select id="tipPlace"></select></label>
  <label>Rating
   <select id="tipRating"><option>5</option><option>4</option><option>3</option><option>2</option><option>1</option></select>
  </label>
  <label>Note <input id="tipText" maxlength="240" required placeholder="Trivia is Thursdays, confirm this week"></label>
  <button class="btn primary" type="submit">Save tip</button>
  <p id="tipStatus" role="status"></p>
 </form>
